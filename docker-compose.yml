# Assessly — runs on the shared EC2 box alongside CodeSync.
#   server (node) : Express API, only reachable on the shared "edge" network
#
# There is no web server in this file. The Caddy container from the CodeSync stack
# terminates TLS, serves the React build from /srv/www/assessly and proxies /api
# here (see deploy/assessly.caddy). deploy/deploy.sh builds the client and ships it.

services:
  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "8000"
      CLIENT_URL: https://assessly.ddnsgeek.com
    volumes:
      # Firebase Admin credentials (read-only); never baked into the image.
      - ./server/config/serviceAccount.json:/app/config/serviceAccount.json:ro
      # Persist uploaded resumes across container restarts.
      - uploads:/app/public
    networks:
      edge:
        aliases:
          - assessly-api
    restart: unless-stopped

networks:
  # Created by the CodeSync stack; its caddy container is on it too
  edge:
    external: true

volumes:
  uploads:
